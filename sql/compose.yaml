name: leetcode-sql
services:
  db:
    image: postgres:18-alpine
    container_name: leetcode-sql-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: leetcode
      POSTGRES_PASSWORD: leetcode
      POSTGRES_DB: leetcode
      # Practice data is disposable; skip fsync for faster resets.
      POSTGRES_INITDB_ARGS: "--data-checksums"
    command: >
      postgres
      -c fsync=off
      -c synchronous_commit=off
      -c full_page_writes=off
    ports:
      - "5432:5432"
    volumes:
      # Postgres 18 images place PGDATA under /var/lib/postgresql/18/docker.
      - pgdata:/var/lib/postgresql
      # Problem files, so `psql -f` inside the container can see them.
      - .:/sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leetcode -d leetcode"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
